{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3><i class="fas fa-file-upload me-2"></i>Upload de Cadastro B3</h3>
        </div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Selecione o arquivo CSV da B3</label>
                    <input type="file" name="arquivo" class="form-control" accept=".csv" required>
                </div>
                <button type="submit" class="btn btn-success">Iniciar Processamento</button>
            </form>
        </div>
    </div>
</div>

<script>
    document.querySelector('form').onsubmit = function() {
        const btn = document.querySelector('button[type="submit"]');
        btn.disabled = true; // Evita clicar duas vezes
        btn.innerHTML = `
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            Processando milhares de linhas... Aguarde.
        `;
    };
</script>
{% endblock %}
